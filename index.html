<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SALOME — CRM</title>
    <style>
      :root {
        --bg: #0b1220;
        --surface: #131c2e;
        --surface-2: #1a2540;
        --ink: #e8eef8;
        --ink-2: #cbd5e1;
        --muted: #a3b1c6;
        --line: #263350;
        --primary: #e8eef8;
        --on-primary: #0b1220;
        --accent: #34d399;
        --accent-soft: #0f3a2c;
        --accent-ink: #6ee7b7;
        --warn: #fbbf24;
        --warn-soft: #3a2a08;
        --danger: #f87171;
        --radius: 14px;
        --radius-sm: 10px;
        --nav-w: 248px;
        font-family: system-ui, -apple-system, sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { border: 0; background: none; cursor: pointer; }

      .i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      
      .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--nav-w); padding: 20px 14px; display: flex; flex-direction: column; gap: 26px; border-right: 1px solid var(--line); background: var(--surface); }
      .brand { padding: 0 6px; display: flex; align-items: center; gap: 10px; }
      .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--primary); color: var(--on-primary); overflow: hidden; }
      .brand-copy strong { display: block; font-size: 16px; }
      .brand-copy small { color: var(--muted); font-size: 12px; }

      .side-nav { display: grid; gap: 4px; }
      .nav-button { width: 100%; min-height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 600; }
      .nav-button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }

      .shell { margin-left: var(--nav-w); }
      main { max-width: 1180px; margin: 0 auto; padding: 28px 32px; }

      .topbar { margin-bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; }
      .eyebrow { margin-bottom: 4px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
      h1 { font-size: 28px; margin: 0; }

      .button { min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; border-radius: var(--radius-sm); font-weight: 600; }
      .button.primary { background: var(--primary); color: var(--on-primary); }
      .button.secondary { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

      .icon-button { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); }

      .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th { padding: 12px 16px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 700; text-align: left; text-transform: uppercase; }
      td { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14px; }

      .code { padding: 4px 8px; border-radius: 6px; background: var(--surface-2); font-family: monospace; }
      .pill { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
      .pill.ok { background: var(--accent-soft); color: var(--accent-ink); }
      .pill.low { background: var(--warn-soft); color: var(--warn); }

      dialog { width: min(calc(100% - 28px), 600px); padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); }
      dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
      .dialog-header { padding: 20px 24px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
      .form-grid { padding: 20px 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .field { display: grid; gap: 6px; }
      .field.wide { grid-column: span 2; }
      .field input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); color: var(--ink); }
      .dialog-actions { padding: 16px 24px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); }
    </style>
  </head>

  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">
          <svg class="i"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
        </span>
        <span class="brand-copy">
          <strong>SALOME</strong>
          <small>CRM</small>
        </span>
      </div>
      <nav class="side-nav">
        <button class="nav-button" aria-current="page">Productos</button>
      </nav>
    </aside>

    <div class="shell">
      <main>
        <div class="topbar">
          <div>
            <p class="eyebrow">Gestión de Ropa</p>
            <h1>Prendas</h1>
          </div>
          <button class="button primary" id="add-product">+ Agregar prenda</button>
        </div>

        <article class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Prenda</th>
                  <th>Código</th>
                  <th>Categoría</th>
                  <th>Talle</th>
                  <th>Precio</th>
                  <th>Costo</th>
                  <th>Stock</th>
                  <th>Estado</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="products-body"></tbody>
            </table>
          </div>
        </article>
      </main>
    </div>

    <dialog id="product-dialog">
      <form id="product-form">
        <header class="dialog-header">
          <h2 id="product-dialog-title">Agregar prenda</h2>
          <button type="button" onclick="document.getElementById('product-dialog').close()">✕</button>
        </header>

        <input type="hidden" name="id" />

        <div class="form-grid">
          <label class="field wide">
            <span>Nombre de la prenda</span>
            <input name="nombre" required placeholder="Ej. Jean Wide Mare" />
          </label>
          <label class="field">
            <span>Código</span>
            <input name="codigo" required placeholder="Ej. 4444" />
          </label>
          <label class="field">
            <span>Talle</span>
            <input name="talle" placeholder="Ej. M, S, L" />
          </label>
          <label class="field">
            <span>Categoría</span>
            <input name="categoria" placeholder="Ej. Pantalones" />
          </label>
          <label class="field">
            <span>Precio de venta ($)</span>
            <input name="precio" type="number" step="0.01" value="0" />
          </label>
          <label class="field">
            <span>Costo ($)</span>
            <input name="costo" type="number" step="0.01" value="0" />
          </label>
          <label class="field">
            <span>Stock actual</span>
            <input name="stock" type="number" value="0" />
          </label>
          <label class="field">
            <span>Stock mínimo</span>
            <input name="stockMinimo" type="number" value="0" />
          </label>
        </div>

        <footer class="dialog-actions">
          <button class="button secondary" type="button" onclick="document.getElementById('product-dialog').close()">Cancelar</button>
          <button class="button primary" type="submit">Guardar prenda</button>
        </footer>
      </form>
    </dialog>

    <script>
      /* PEGÁ AQUÍ TU URL DE GOOGLE APPS SCRIPT: */
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNqAO4lhDvSHrp9k_V0g8EqhNMSGeIfKPdz9qJkI7V150Ro8p6CXy3BUgxHa5-cHI/exec";
      const PIN = "123456"; // Tu ACCESS_PIN asignado en Configuracion

      let state = { products: [] };

      const $ = s => document.querySelector(s);

      async function loadData() {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "bootstrap", pin: PIN })
          });
          const json = await res.json();
          if (json.ok) {
            state.products = json.data.products || [];
            renderProducts();
          }
        } catch (e) {
          console.error("Error al cargar prendas", e);
        }
      }

      function renderProducts() {
        const tbody = $("#products-body");
        tbody.innerHTML = state.products.map(p => {
          const isLow = Number(p.stockMinimo) > 0 && Number(p.stock) <= Number(p.stockMinimo);
          return `
            <tr>
              <td><strong>${p.nombre || "—"}</strong></td>
              <td><span class="code">${p.codigo || "—"}</span></td>
              <td>${p.categoria || "—"}</td>
              <td><strong>${p.talle || "—"}</strong></td>
              <td><strong>$ ${Number(p.precio || 0).toLocaleString("es-AR")}</strong></td>
              <td>$ ${Number(p.costo || 0).toLocaleString("es-AR")}</td>
              <td><strong>${p.stock || 0}</strong> / mín. ${p.stockMinimo || 0}</td>
              <td><span class="pill ${isLow ? 'low' : 'ok'}">${isLow ? 'Stock bajo' : 'Disponible'}</span></td>
              <td><button class="icon-button" onclick="editProduct('${p.id}')">✏️</button></td>
            </tr>
          `;
        }).join("");
      }

      function openModal(p = null) {
        const f = $("#product-form");
        f.reset();
        $("#product-dialog-title").textContent = p ? "Editar prenda" : "Agregar prenda";
        if (p) {
          f.elements.id.value = p.id || "";
          f.elements.nombre.value = p.nombre || "";
          f.elements.codigo.value = p.codigo || "";
          f.elements.talle.value = p.talle || "";
          f.elements.categoria.value = p.categoria || "";
          f.elements.precio.value = p.precio || 0;
          f.elements.costo.value = p.costo || 0;
          f.elements.stock.value = p.stock || 0;
          f.elements.stockMinimo.value = p.stockMinimo || 0;
        }
        $("#product-dialog").showModal();
      }

      window.editProduct = id => {
        const p = state.products.find(x => x.id === id);
        if (p) openModal(p);
      };

      $("#add-product").addEventListener("click", () => openModal());

      $("#product-form").addEventListener("submit", async e => {
        e.preventDefault();
        const f = e.target;
        const payload = {
          id: f.elements.id.value,
          nombre: f.elements.nombre.value,
          codigo: f.elements.codigo.value,
          talle: f.elements.talle.value,
          categoria: f.elements.categoria.value,
          precio: Number(f.elements.precio.value),
          costo: Number(f.elements.costo.value),
          stock: Number(f.elements.stock.value),
          stockMinimo: Number(f.elements.stockMinimo.value)
        };

        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "saveProduct", pin: PIN, product: payload })
          });
          $("#product-dialog").close();
          await loadData();
        } catch (err) {
          alert("Ocurrió un error al guardar la prenda.");
        }
      });

      loadData();
    </script>
  </body>
</html>
